<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AdmitiQ">
  <title>AdmitiQ</title>
  <rect width="64" height="64" rx="10" fill="#E8EDF4"/>
  <rect x="5" y="5" width="54" height="54" rx="8" fill="#FFFFFF" stroke="#0E1520" stroke-width="3"/>
  <!-- perforation -->
  <g fill="#0E1520">
    <circle cx="5" cy="20" r="2"/>
    <circle cx="5" cy="32" r="2"/>
    <circle cx="5" cy="44" r="2"/>
    <circle cx="59" cy="20" r="2"/>
    <circle cx="59" cy="32" r="2"/>
    <circle cx="59" cy="44" r="2"/>
  </g>
  <!-- series label -->
  <text x="14" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="5.5" fill="#5A6578" letter-spacing="1">ADM</text>
  <!-- AQ -->
  <text x="32" y="40" text-anchor="middle" font-family="Arial Black, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="-1.2" fill="#0E1520">AQ</text>
  <!-- SIGNED stamp (site accent) -->
  <g transform="translate(42 20) rotate(-16)">
    <rect x="-16" y="-8" width="32" height="16" rx="2" fill="none" stroke="#FF3B1F" stroke-width="2.2"/>
    <text text-anchor="middle" y="3.2" font-family="Arial Black, Helvetica Neue, Arial, sans-serif" font-size="6.5" font-weight="800" fill="#FF3B1F" letter-spacing="0.8">SIGNED</text>
  </g>
  <rect x="18" y="48" width="28" height="2.2" fill="#0047FF"/>
</svg>
