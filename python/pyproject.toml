[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "admitiq"
version = "0.3.5"
description = "AdmitiQ: signed, expiring, revocable tokens for QR codes and ticket links. By LogicLitz — https://admitiq.logiclitz.org"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "LogicLitz", email = "logiclitz@gmail.com" }]
maintainers = [{ name = "LogicLitz", email = "logiclitz@gmail.com" }]
keywords = [
  "qr",
  "qrcode",
  "security",
  "tokens",
  "tickets",
  "attendance",
  "coupons",
  "hmac",
  "signed-url",
  "single-use",
  "admitiq",
  "logiclitz",
]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
qr = ["qrcode[pil]>=7.4"]
ec = ["cryptography>=41.0"]
redis = ["redis>=4.5"]
dev = ["pytest>=7.0", "fastapi>=0.100", "flask>=2.3", "httpx>=0.24"]

[project.urls]
Homepage = "https://admitiq.logiclitz.org"
Documentation = "https://admitiq.logiclitz.org/getting-started"
Tutorial = "https://admitiq.logiclitz.org/tutorial"
Playground = "https://admitiq.logiclitz.org/debugger"
"LogicLitz" = "https://logiclitz.org"
Repository = "https://github.com/HyperXfury1873/admitiq"
Issues = "https://github.com/HyperXfury1873/admitiq/issues"
Changelog = "https://github.com/HyperXfury1873/admitiq/releases"
"Source docs" = "https://github.com/HyperXfury1873/admitiq/tree/main/docs"
