[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "admitiq"
version = "0.3.4"
description = "AdmitiQ: signed, expiring, revocable tokens for QR codes and ticket links. https://admitiq.logiclitz.org"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "LogicLitz" }]
keywords = [
  "qr",
  "qrcode",
  "security",
  "tokens",
  "tickets",
  "attendance",
  "coupons",
  "hmac",
  "signed-url",
  "single-use",
  "admitiq",
]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
qr = ["qrcode[pil]>=7.4"]
ec = ["cryptography>=41.0"]
redis = ["redis>=4.5"]
dev = ["pytest>=7.0", "fastapi>=0.100", "flask>=2.3", "httpx>=0.24"]

[project.urls]
Homepage = "https://admitiq.logiclitz.org"
Documentation = "https://github.com/HyperXfury1873/admitiq/tree/main/docs"
Repository = "https://github.com/HyperXfury1873/admitiq"
Issues = "https://github.com/HyperXfury1873/admitiq/issues"
